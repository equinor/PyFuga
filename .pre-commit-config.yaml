repos:
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        language_version: python3
        additional_dependencies:
          - "black[jupyter]"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff-check
        name: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: project-version-consistency
        name: project version vs pyproject.toml
        entry: python
        args: [scripts/check_project_version_consistency.py]
        language: python
        additional_dependencies: [packaging>=24]
        pass_filenames: false
        files: ^(pyproject\.toml|CITATION\.cff|conda-recipe/meta\.yaml|CHANGELOG\.md|docs/conf\.py|pixi\.lock)$
      - id: pixi-frozen-all-envs
        name: pixi frozen environments (pre-push)
        entry: python scripts/check_pixi_frozen.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
