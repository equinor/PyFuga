[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfuga"
version = "0.4.1"
description = "Linearised CFD wake model (PyFuga)"
readme = "README.md"
authors = [{ name = "PyFuga team", email = "lalc@dtu.dk" }]
license = "MIT"
# Note: Keep in sync with [tool.pyfuga] min-python-version and supported-python-versions
requires-python = ">=3.10, <3.15"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.10",
  "matplotlib>=3.10.8",
  "xarray>=2025.6.1",
  "tqdm>=4.67.3",
  "h5netcdf>=1.8.1",
  "h5py>=3.15.1",
  "numba>=0.63.1",
]

[project.urls]
Repository = "https://gitlab.windenergy.dtu.dk/TOPFARM/PyFuga"
Documentation = "https://topfarm.pages.windenergy.dtu.dk/PyFuga/"
Issues = "https://gitlab.windenergy.dtu.dk/TOPFARM/PyFuga/-/issues"

[project.optional-dependencies]
tests = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.0",
  "memory_profiler>=0.61.0",
  "line_profiler>=5.0.0",
  "nbconvert>=7.16.6,<8",
  "ipykernel>=6.29,<8",      # <8 matches docs extra (ipykernel==7.2.0) for unified Pixi/dev installs
  "jupyter_client>=8.6,<9",
]

lint = [
  "ruff>0.14",
  "black[jupyter]>=26.1.0",
  "mypy>=1.19.1",
  "packaging>=24",
  "scipy-stubs>=1.10,<1.18",
  "types-tqdm>=4.0",
]

# Pinned for reproducible docs and compatibility with sphinx-multiversion 0.2.4 (no Sphinx 9 support).
docs = [
  "sphinx==7.4.7",
  # 2025.x requires Python>=3.11; keep 2024.10.x so Pixi py310 environments can still install [docs].
  "sphinx-autobuild==2024.10.3",
  "sphinx-rtd-theme==3.1.0",
  "sphinx-rtd-dark-mode==1.3.0",
  "nbsphinx==0.9.8",
  "sphinxcontrib-bibtex==2.6.5",
  "sphinx-multiversion==0.2.4",
  "sphinx-copybutton==0.5.2",
  "ipykernel==7.2.0",
]

# Convenience group for local development
dev = ["pyfuga[tests,lint,docs]", "pre-commit", "build>=1.4.0,<2"]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["pyfuga*"]
exclude = ["constraints*", "tests*", "docs*", "build*"]
namespaces = false

# --------------------------------------------------------------------------------------------------
# Pixi configuration
# --------------------------------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.dependencies]
pip = ">=25.2,<26"

[tool.pixi.feature.dev.pypi-dependencies]
pyfuga = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.feature.ci-tests.pypi-dependencies]
pyfuga = { path = ".", editable = true, extras = ["tests"] }

[tool.pixi.tasks]
# Formatting
check-fmt = "pixi run -e py312 black --check . && pixi run -e py312 ruff check ."
fmt = "pixi run -e py312 black . && pixi run -e py312 ruff check . --fix"

# Static typing (strict; see [tool.mypy] — only pyfuga.typing is fully enforced until follow-up MRs)
# Run in the pinned py310 environment: it matches [tool.mypy] python_version and the CI
# lint job, so local runs reproduce CI exactly. Newer environments resolve a newer xarray
# whose `Dataset.sel` typing differs, and would report errors CI does not see.
mypy = "pixi run -e py310 python -m mypy pyfuga"

# Testing
test = "pixi run -e py312 pytest --cov-report term-missing:skip-covered --cov=pyfuga --cov-config .coveragerc --import-mode=importlib"

# Documentation
build-docs = "rm -rf docs/_build && rm -rf docs/api/generated && NUMBA_DISABLE_JIT=1 pixi run -e py312 sphinx-build -b html docs docs/_build"
autobuild-docs = """
pixi run -e py312 sphinx-autobuild docs docs/_build \
  --port 8000 \
  --watch pyfuga \
  --open-browser
"""
# Multiversion + root redirect + http.server (same landing logic as CI build_pages)
serve-multiversion-docs = { cmd = "bash scripts/serve_multiversion_docs.sh" }

# Debugging
doctor = "python scripts/dev.py doctor"
sync-conda-recipe = "python scripts/sync_conda_recipe.py"
check-conda-recipe = "python scripts/sync_conda_recipe.py --check"
check-conda-recipe-remote = "python scripts/sync_conda_recipe.py --check --check-remote-source"
check-project-version = "python scripts/check_project_version_consistency.py"

# CI
ci = { depends-on = [
  "test",
  "check-fmt",
  "check-project-version",
  "mypy",
  "build-docs",
] }

# Pin per-environment Python versions (so Pixi doesn't pick 3.14 etc.)
[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
numpy = ">=1.26,<2.4"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
numpy = ">=1.26,<2.4"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
numpy = ">=1.26,<2.4"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
numpy = ">=2.3.2,<2.4"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"
numpy = ">=2.3.2,<2.4"

[tool.pixi.environments]
default = ["dev"]
py310 = ["py310", "dev"]
py311 = ["py311", "dev"]
py312 = ["py312", "dev"]
py313 = ["py313", "dev"]
py314 = ["py314", "dev"]
py310-ci = ["py310", "ci-tests"]
py311-ci = ["py311", "ci-tests"]
py312-ci = ["py312", "ci-tests"]
py313-ci = ["py313", "ci-tests"]
py314-ci = ["py314", "ci-tests"]

# --------------------------------------------------------------------------------------------------
# Black configuration
# --------------------------------------------------------------------------------------------------

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = """
(
  ^docs/_build/
  | ^.pixi/
  | ^.git/
  | ^.pytest_cache/
  | ^.ruff_cache/
  | ^.mypy_cache/
  | ^.vscode/
  | ^.gitlab/
)
"""

# --------------------------------------------------------------------------------------------------
# Ruff configuration (replaces pylint + pycodestyle + isort)
# --------------------------------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import sorting (replaces isort)
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "C4",  # comprehensions
]

ignore = [
  "E203", # whitespace before ':', conflicts with black
]

[tool.ruff.lint.isort]
known-first-party = ["pyfuga"]

# --------------------------------------------------------------------------------------------------
# Mypy (strict; incremental adoption via per-module overrides)
# --------------------------------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
explicit_package_bases = true
# Checked paths (same as CI / `pixi run mypy`)
files = ["pyfuga"]
mypy_path = ["typings"]

# Targeted relaxations for modules that cross numba/runtime-typed boundaries.
[[tool.mypy.overrides]]
module = "pyfuga._fuga"
ignore_errors = false
disable_error_code = ["no-untyped-call"]

[[tool.mypy.overrides]]
module = "pyfuga.common"
ignore_errors = false
disable_error_code = ["no-untyped-call", "no-any-return", "untyped-decorator"]

[[tool.mypy.overrides]]
module = "pyfuga.flut"
ignore_errors = false
disable_error_code = ["no-untyped-call"]

# utils imports numba's njit. Newer numba ships type information, which makes the
# import "typed" (so the `# type: ignore[import-untyped]` reads as unused) and makes
# the dynamic njit(...) call fail overload resolution; older numba is untyped and
# needs the ignore. Relax both codes here so linting passes across numba versions.
[[tool.mypy.overrides]]
module = "pyfuga.utils"
ignore_errors = false
disable_error_code = ["call-overload", "unused-ignore"]

[[tool.mypy.overrides]]
module = "pyfuga.preludium_eq_routines"
ignore_errors = false
disable_error_code = ["no-untyped-call", "no-any-return", "untyped-decorator"]

# The split preluts_generator pipeline still contains dynamic/numba-heavy codepaths.
[[tool.mypy.overrides]]
module = "pyfuga.preluts_generator"
ignore_errors = false
disable_error_code = [
  "no-untyped-call",
  "no-untyped-def",
  "untyped-decorator",
  "no-any-return",
  "attr-defined",
]

[[tool.mypy.overrides]]
module = "pyfuga.preluts_generator.*"
ignore_errors = false
disable_error_code = [
  "no-untyped-call",
  "no-untyped-def",
  "untyped-decorator",
  "no-any-return",
  "attr-defined",
]

[[tool.mypy.overrides]]
module = "memory_profiler"
ignore_missing_imports = true

# --------------------------------------------------------------------------------------------------
# PyFuga project configuration
# --------------------------------------------------------------------------------------------------

[tool.pyfuga]
# Minimum supported Python version (used for linting target-version)
min-python-version = "3.10"
# All supported Python versions (used for CI/testing matrix)
supported-python-versions = ["3.10", "3.11", "3.12", "3.13", "3.14"]

# --------------------------------------------------------------------------------------------------
# Pytest configuration
# --------------------------------------------------------------------------------------------------

[tool.pytest.ini_options]
markers = ["local: mark test as local-only (not run in CI)"]

# --------------------------------------------------------------------------------------------------
# Pyright configuration
# --------------------------------------------------------------------------------------------------

[tool.basedpyright]
typeCheckingMode = "off"
venvPath = ".pixi/envs"
venv = "py312"
pythonVersion = "3.12"
