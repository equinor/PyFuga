# Shared build CI configuration (image builds, docs builds, and release artifact builds).

# ===== Image builds =====

# ----- Shared YAML anchors to reduce boilerplate -----
.kaniko_registry_auth_cmd: &kaniko_registry_auth_cmd |
  mkdir -p /kaniko/.docker
  cat > /kaniko/.docker/config.json <<EOF
  {
    "auths": {
      "${CI_REGISTRY}": {
        "username": "${CI_REGISTRY_USER}",
        "password": "${CI_REGISTRY_PASSWORD}"
      }
    }
  }
  EOF

.windows_pixi_base_changes: &windows_pixi_base_changes
  - ci/Dockerfile.windows-pixi-base
  - ci/Dockerfile.windows-pixi-ci-env
  - pixi.lock
  - .gitlab/ci/build.yml

.windows_pixi_env_changes: &windows_pixi_env_changes
  - ci/Dockerfile.windows-pixi-base
  - ci/Dockerfile.windows-pixi-ci-env
  - .gitlab/ci/build.yml
  - pyproject.toml
  - pixi.lock

# ----- Build CI base image (default Python version only) -----
build_linux_base_image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  cache: []
  variables:
    PYTHON_VERSION: "${PYTHON_DEFAULT_VERSION}"
    CI_IMAGE_REPO: "${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_DEFAULT_VERSION}-uv"
  script:
    # Authenticate to the GitLab registry using the built-in CI variables
    - *kaniko_registry_auth_cmd

    # Build and push base image (only :latest to limit registry tag churn)
    - |
      DEST_LATEST="${CI_IMAGE_REPO}:latest"

      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/ci/Dockerfile" \
        --cache=true \
        --cache-repo "${CI_REGISTRY_IMAGE}/ci/kaniko-cache" \
        --cache-ttl 168h \
        --build-arg "PYTHON_VERSION=${PYTHON_VERSION}" \
        --target "base" \
        --destination "$DEST_LATEST"

  rules:
    # Rebuild automatically when the Dockerfile changes
    - changes:
        - ci/Dockerfile
      when: on_success
      allow_failure: false
    # Otherwise allow manual rebuilds from the UI
    - when: manual
      allow_failure: true
  tags:
    - docker
    - ubuntu
    - linux

# ----- Build Linux test images with preinstalled test dependencies -----
build_linux_test_images:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  cache: []
  parallel:
    matrix:
      - PYTHON_VERSION: "3.10"
        PYTHON_VERSION_TAG: "310"
      - PYTHON_VERSION: "3.11"
        PYTHON_VERSION_TAG: "311"
      - PYTHON_VERSION: "3.12"
        PYTHON_VERSION_TAG: "312"
      - PYTHON_VERSION: "3.13"
        PYTHON_VERSION_TAG: "313"
      - PYTHON_VERSION: "3.14"
        PYTHON_VERSION_TAG: "314"
  variables:
    CI_IMAGE_REPO: "${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_VERSION}-uv-tests"
    CONSTRAINT_FILE: "constraints/py${PYTHON_VERSION_TAG}.txt"
  script:
    - *kaniko_registry_auth_cmd
    - |
      DEST_LATEST="${CI_IMAGE_REPO}:latest"

      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/ci/Dockerfile" \
        --cache=true \
        --cache-repo "${CI_REGISTRY_IMAGE}/ci/kaniko-cache" \
        --cache-ttl 168h \
        --build-arg "PYTHON_VERSION=${PYTHON_VERSION}" \
        --build-arg "CONSTRAINT_FILE=${CONSTRAINT_FILE}" \
        --target "tests" \
        --destination "$DEST_LATEST"
  rules:
    - changes:
        - ci/Dockerfile
        - pyproject.toml
        - constraints/**/*
      when: on_success
      allow_failure: false
    - if: '$FORCE_LINUX_TEST_IMAGE_BUILD == "1"'
      when: manual
      allow_failure: true
    - when: never
  tags:
    - docker
    - ubuntu
    - linux

# ----- Build Linux docs image (default Python version only) -----
build_linux_docs_image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  cache: []
  variables:
    CI_IMAGE_REPO_DOCS: "${CI_REGISTRY_IMAGE}/ci/python-${PYTHON_DEFAULT_VERSION}-uv-docs"
  script:
    # Authenticate to the GitLab registry using the built-in CI variables
    - *kaniko_registry_auth_cmd

    # Build and push docs image (only :latest to limit registry tag churn)
    - |
      DEST_LATEST="${CI_IMAGE_REPO_DOCS}:latest"

      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/ci/Dockerfile.docs" \
        --build-arg "PYTHON_VERSION=${PYTHON_DEFAULT_VERSION}" \
        --target "docs" \
        --destination "$DEST_LATEST"

  rules:
    # Rebuild automatically when docs-image inputs change
    - changes:
        - ci/Dockerfile.docs
      when: on_success
      allow_failure: false
    # Otherwise allow manual rebuilds from the UI
    - when: manual
      allow_failure: true
  tags:
    - docker
    - ubuntu
    - linux

# ----- Compute content-derived tag for Windows Pixi images -----
# Runs on every pipeline so test jobs can always resolve the image tag,
# even when the build jobs are skipped (no dep-file changes).
prepare_windows_env_tag:
  stage: prepare
  image: alpine:latest
  cache: []
  script:
    - |
      # Protected refs can build/push exact content-derived tags.
      # Unprotected refs cannot update Windows images, so they must pull an existing tag.
      if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
        ENV_TAG=$(cat ci/Dockerfile.windows-pixi-base ci/Dockerfile.windows-pixi-ci-env pixi.lock | sha256sum | cut -c1-12)
      else
        ENV_TAG="latest"
      fi
      echo "ENV_TAG=${ENV_TAG}"
      echo "ENV_TAG=${ENV_TAG}" > env_tag.env
  artifacts:
    reports:
      dotenv: env_tag.env
    expire_in: 1 day
  rules:
    - when: always
  tags:
    - docker
    - ubuntu
    - linux

# ----- Build Windows Pixi base image (protected refs only) -----
build_windows_pixi_base:
  stage: build
  cache: []
  needs:
    - job: prepare_windows_env_tag
      artifacts: true
  script:
    - $DockerConfigDir = Join-Path $env:CI_PROJECT_DIR ".docker-tmp"
    - New-Item -ItemType Directory -Force -Path $DockerConfigDir | Out-Null
    - $env:DOCKER_CONFIG = $DockerConfigDir
    - $BaseRepo = "$env:CI_REGISTRY_IMAGE/ci/windows-pixi-base"
    - $DestTag = "${BaseRepo}:$env:ENV_TAG"
    - $DestLatest = "${BaseRepo}:latest"
    - docker version
    - docker system df
    - $env:CI_REGISTRY_PASSWORD | docker login $env:CI_REGISTRY --username $env:CI_REGISTRY_USER --password-stdin
    - |
      docker pull $DestLatest
      if ($LASTEXITCODE -ne 0) {
        Write-Host "No existing cache image for $DestLatest (first build or cache miss)."
        $global:LASTEXITCODE = 0
      } else {
        Write-Host "Using cache image: $DestLatest"
      }
    - docker build --pull --cache-from $DestLatest -f ci/Dockerfile.windows-pixi-base -t $DestTag -t $DestLatest .
    - docker push $DestTag
    - docker push $DestLatest
    - |
      $ProjectImagePrefix = "$env:CI_REGISTRY_IMAGE/ci/windows-pixi"
      # Skip :<none> — docker image rm cannot use that pseudo-tag; prune removes dangling images.
      $ProjectImagesToDelete = docker image ls --format "{{.Repository}}:{{.Tag}}" |
        Where-Object {
          $_ -like "$ProjectImagePrefix*" -and
          $_ -notmatch ":(latest|$($env:ENV_TAG))$" -and
          $_ -notmatch ':<none>$'
        }
      if ($ProjectImagesToDelete) {
        Write-Host "Removing old project images after push (keeping :latest and :$env:ENV_TAG):"
        $ProjectImagesToDelete | ForEach-Object { Write-Host " - $_" }
        $ProjectImagesToDelete | ForEach-Object { docker image rm -f $_ }
      } else {
        Write-Host "No old tagged project images to remove after push (dangling layers left for prune)."
      }
    - Remove-Item -Recurse -Force $DockerConfigDir
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        *windows_pixi_base_changes
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $FORCE_WINDOWS_IMAGE_BUILD == "1"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_REF_PROTECTED != "true" && $ALLOW_UNPROTECTED_WINDOWS_IMAGE_BUILD == "1" && $FORCE_WINDOWS_IMAGE_BUILD == "1"'
      when: manual
      allow_failure: true
    - when: never
  tags:
    - windows
    - docker
    - shell

# ----- Build Windows Pixi per-environment images (protected refs only) -----
build_windows_pixi_envs:
  stage: build
  cache: []
  needs:
    - job: prepare_windows_env_tag
      artifacts: true
    - job: build_windows_pixi_base
      optional: true
  parallel:
    matrix:
      - PIXI_ENV: ["py310-ci", "py311-ci", "py312-ci", "py313-ci", "py314-ci"]
  script:
    - $DockerConfigDir = Join-Path $env:CI_PROJECT_DIR ".docker-tmp"
    - New-Item -ItemType Directory -Force -Path $DockerConfigDir | Out-Null
    - $env:DOCKER_CONFIG = $DockerConfigDir
    - $BaseRepo = "$env:CI_REGISTRY_IMAGE/ci/windows-pixi-base"
    - $BaseImage = "${BaseRepo}:$env:ENV_TAG"
    - $BaseLatest = "${BaseRepo}:latest"
    - $EnvRepo = "$env:CI_REGISTRY_IMAGE/ci/windows-pixi-$env:PIXI_ENV"
    - $DestTag = "${EnvRepo}:$env:ENV_TAG"
    - $DestLatest = "${EnvRepo}:latest"
    - docker version
    - docker system df
    - $env:CI_REGISTRY_PASSWORD | docker login $env:CI_REGISTRY --username $env:CI_REGISTRY_USER --password-stdin
    - |
      docker pull $DestLatest
      if ($LASTEXITCODE -ne 0) {
        Write-Host "No existing cache image for $DestLatest (first build or cache miss)."
        $global:LASTEXITCODE = 0
      } else {
        Write-Host "Using cache image: $DestLatest"
      }
    - |
      docker pull $BaseImage
      if ($LASTEXITCODE -ne 0) {
        Write-Host "Content tag not in registry ($BaseImage); falling back to $BaseLatest"
        docker pull $BaseLatest
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Neither $BaseImage nor $BaseLatest found. Run build_windows_pixi_base first."
          exit 1
        }
        docker tag $BaseLatest $BaseImage
      } else {
        Write-Host "Using base image: $BaseImage"
      }
    - docker build `
      --cache-from $DestLatest `
      --build-arg BASE_IMAGE=$BaseImage `
      --build-arg PIXI_ENV=$env:PIXI_ENV `
      -f ci/Dockerfile.windows-pixi-ci-env `
      -t $DestTag -t $DestLatest .
    - docker push $DestTag
    - docker push $DestLatest
    - |
      $ProjectImagePrefix = "$env:CI_REGISTRY_IMAGE/ci/windows-pixi"
      # Skip :<none> — docker image rm cannot use that pseudo-tag; prune removes dangling images.
      $ProjectImagesToDelete = docker image ls --format "{{.Repository}}:{{.Tag}}" |
        Where-Object {
          $_ -like "$ProjectImagePrefix*" -and
          $_ -notmatch ":(latest|$($env:ENV_TAG))$" -and
          $_ -notmatch ':<none>$'
        }
      if ($ProjectImagesToDelete) {
        Write-Host "Removing old project images after push (keeping :latest and :$env:ENV_TAG):"
        $ProjectImagesToDelete | ForEach-Object { Write-Host " - $_" }
        $ProjectImagesToDelete | ForEach-Object { docker image rm -f $_ }
      } else {
        Write-Host "No old tagged project images to remove after push (dangling layers left for prune)."
      }
    - Remove-Item -Recurse -Force $DockerConfigDir
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        *windows_pixi_env_changes
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $FORCE_WINDOWS_IMAGE_BUILD == "1"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_REF_PROTECTED != "true" && $ALLOW_UNPROTECTED_WINDOWS_IMAGE_BUILD == "1" && $FORCE_WINDOWS_IMAGE_BUILD == "1"'
      when: manual
      allow_failure: true
    - when: never
  tags:
    - windows
    - docker
    - shell

# ----- Prune dangling images on Windows shell executor (after Pixi image builds) -----
# Single job avoids parallel matrix jobs racing on "docker image prune already running".
# Plain `docker image prune -f` would remove every dangling image on the shared daemon; we only
# remove dangling images whose repository path starts with CI_REGISTRY_IMAGE (this project).
prune_windows_docker_images:
  stage: build
  cache: []
  needs:
    - job: build_windows_pixi_base
      optional: true
    - job: build_windows_pixi_envs
  tags:
    - windows
    - docker
    - shell
  script:
    - |
      Write-Host "Pruning dangling images for this project only (registry prefix: $env:CI_REGISTRY_IMAGE)..."
      $prefix = $env:CI_REGISTRY_IMAGE.TrimEnd('/')
      $removed = 0
      docker image ls --filter "dangling=true" --format "{{.ID}}\t{{.Repository}}" | ForEach-Object {
        $parts = $_ -split "`t", 2, [System.StringSplitOptions]::None
        if ($parts.Count -lt 2) { return }
        $id = $parts[0].Trim()
        $repo = $parts[1].Trim()
        if ($repo.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
          docker rmi -f $id 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { $removed++ }
        }
      }
      Write-Host "Removed $removed dangling image(s) under this project's registry path."
      docker system df
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      changes:
        *windows_pixi_env_changes
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $FORCE_WINDOWS_IMAGE_BUILD == "1"'
      when: on_success
      allow_failure: true
    - if: '$CI_COMMIT_REF_PROTECTED != "true" && $ALLOW_UNPROTECTED_WINDOWS_IMAGE_BUILD == "1" && $FORCE_WINDOWS_IMAGE_BUILD == "1"'
      when: on_success
      allow_failure: true
    - when: never

# ===== Documentation builds =====

# ----- Build docs on every push (for preview / CI sanity) -----
build_docs:
  stage: build
  extends: .default_python_job
  image: ${PYFUGA_CI_IMAGE_PREFIX}/ci/python-${PYTHON_DEFAULT_VERSION}-uv-docs:latest
  script:
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install ".[docs]"
    - cd docs
    - sphinx-build -b html -W --keep-going . _build 2>&1 | tee ../sphinx-build-docs.log # for branch builds, a simple single-version build is enough
    - |
      if rg -n ": ERROR:" ../sphinx-build-docs.log; then
        echo "Sphinx reported one or more errors."
        exit 1
      fi
  artifacts:
    paths:
      - docs/_build
    expire_in: 1 week
  rules:
    # Never run on main, since main will use the pages build/deploy jobs to build the full multiversion docs for the official site
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never

    # Also skip on tags, since they will also trigger the pages build/deploy jobs which build the full multiversion docs
    - if: "$CI_COMMIT_TAG"
      when: never

    # Auto if branch name contains "docs"
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH =~ /^docs\//'
      when: on_success
      allow_failure: false

    # Otherwise manual
    - when: manual
      allow_failure: true

# ----- Build PyFuga docs for GitLab Pages (official site) -----
build_pages:
  stage: build
  extends: .default_python_job
  image: ${PYFUGA_CI_IMAGE_PREFIX}/ci/python-${PYTHON_DEFAULT_VERSION}-uv-docs:latest
  variables:
    # Docs build does not require Git LFS objects; skip smudge to speed up checkout.
    GIT_LFS_SKIP_SMUDGE: "1"
  script:
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install ".[docs]"

    # --- Make sure sphinx-multiversion can see refs ------------
    # Fetch complete history (in case job is still shallow)
    - git fetch --unshallow --tags || git fetch --tags
    # Fetch all remote branches as local remote-tracking branches
    - git fetch origin "+refs/heads/*:refs/remotes/origin/*"
    # -----------------------------------------------------------

    # Docs build: two-step HTML (PyWakeEllipSys-style), optional shared assets, landing redirect, Pages layout.
    # (If you add docs/figures + generate_figures.py like PyWakeEllipSys, run that here before sphinx-build.)
    - |
      cd docs
      sphinx-build -b html -W --keep-going . _build/main 2>&1 | tee ../sphinx-main.log
      sphinx-multiversion . _build 2>&1 | tee ../sphinx-multiversion.log
      if rg -n ": ERROR:" ../sphinx-main.log ../sphinx-multiversion.log; then
        echo "Sphinx reported one or more errors."
        exit 1
      fi
      if [ -d figures ]; then
        cp -r figures _build/
      fi
      LATEST_TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)" 2>/dev/null || true)
      if [ -n "$LATEST_TAG" ] && [ -d "_build/${LATEST_TAG}" ]; then
        DEFAULT_REF="$LATEST_TAG"
      else
        DEFAULT_REF="main"
      fi
      echo "Landing page redirect target: ${DEFAULT_REF}"
      test -d "_build/${DEFAULT_REF}" || (echo "Missing _build/${DEFAULT_REF} after docs build"; find _build -maxdepth 2 -type d | sort; exit 1)
      sed "s|TAG|${DEFAULT_REF}|g" root_index_template.html > _build/index.html
      cd ..
      mv docs/_build public/
      {
        echo "/${DEFAULT_REF} /${DEFAULT_REF}/index.html 301"
        echo "/${DEFAULT_REF}/ /${DEFAULT_REF}/index.html 301"
        echo "/main /main/index.html 301"
        echo "/main/ /main/index.html 301"
      } > public/_redirects

    # --- CI sanity checks for expected published paths ----------
    - test -d "public/main" || (echo "Missing public/main after docs build"; find public -maxdepth 2 -type d | sort; exit 1)
    - test -f "public/main/theory/ffit.html" || (echo "Missing public/main/theory/ffit.html"; find public/main/theory -maxdepth 1 -type f | sort; exit 1)
    # If v0.1.0 exists, assert that it is included in multiversion output.
    - |
      if git rev-parse -q --verify "refs/tags/v0.1.0" >/dev/null; then
        test -d "public/v0.1.0" || (echo "Missing public/v0.1.0 in multiversion output"; find public -maxdepth 2 -type d | sort; exit 1)
      fi
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    # Only build docs for main branch and tags (releases)
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: on_success
      allow_failure: false

    # Temporary manual run on this branch
    - if: '$CI_COMMIT_BRANCH == "test-pages"'
      when: manual
      allow_failure: true

    # Otherwise never run
    - when: never

# ===== Release artifact builds =====

# ----- Build and validate release artifacts (no publish) -----
build_release_artifacts:
  stage: build
  extends: .default_python_job
  script:
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_VERSION="${CI_COMMIT_TAG#v}"
        PYPROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        test "$TAG_VERSION" = "$PYPROJECT_VERSION" || {
          echo "Tag version ($TAG_VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)"
          exit 1
        }
      fi
    - uv pip install build twine
    - python -m build
    - python scripts/sync_conda_recipe.py --check
    - python -m twine check dist/*
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    # Always validate artifacts for tags/releases
    - if: "$CI_COMMIT_TAG"
      when: on_success
      allow_failure: false

    # Optional manual run on branches
    - when: manual
      allow_failure: true
