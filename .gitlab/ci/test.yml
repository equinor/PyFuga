# Test CI configuration (pytest, matrix testing, and linting).

# ===== Test stage =====

# ----- Test PyFuga (quick, every push) -----
test_linux_default:
  stage: test
  image: ${PYFUGA_CI_IMAGE_PREFIX}/ci/python-${PYTHON_DEFAULT_VERSION}-uv-tests:latest
  extends:
    - .default_python_job
    - .pytest_coverage
    - .pytest_notebook_html_artifacts
    - .rules_on_code_changes
  variables:
    GIT_LFS_SKIP_SMUDGE: "0"
  needs:
    - job: lint
      artifacts: false
    - job: security_secret_scan
      artifacts: false
    - job: security_dependency_audit
      artifacts: false
    - job: security_bandit
      artifacts: false
    - job: build_linux_test_images
      artifacts: false
      optional: true
  script:
    - python -m pytest -n logical --dist loadfile --cov-report
      term-missing:skip-covered --cov=pyfuga --cov-config .coveragerc
      --import-mode=importlib -m "not local" tests/

# ----- Test PyFuga on Windows (Stage 1: default Python only) -----
test_windows_default:
  extends:
    - .windows_test_job
    - .rules_on_code_changes
  image:
    name: ${PYFUGA_CI_IMAGE_PREFIX}/ci/windows-pixi-py${PYTHON_DEFAULT_VERSION_TAG}-ci:${ENV_TAG}
    pull_policy: always
  needs:
    - job: prepare_windows_env_tag
      artifacts: true
    - job: build_windows_pixi_base
      artifacts: false
      optional: true
    - job: build_windows_pixi_envs
      artifacts: false
      optional: true
  variables:
    PIXI_ENV: "py${PYTHON_DEFAULT_VERSION_TAG}-ci"
  cache: []
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File ci/scripts/windows_test_common.ps1

# ----- Test PyFuga on Windows (full matrix, change-based + scheduled) -----
test_windows_matrix:
  extends:
    - .windows_test_job
    - .rules_python_matrix_on_changes_or_schedule
  # Shared Windows runners can become unstable when all matrix jobs run concurrently.
  # Use a single resource group so matrix entries execute serially.
  resource_group: windows-test-matrix
  image:
    name: ${PYFUGA_CI_IMAGE_PREFIX}/ci/windows-pixi-${PIXI_ENV}:${ENV_TAG}
    pull_policy: always
  needs:
    - job: prepare_windows_env_tag
      artifacts: true
    - job: build_windows_pixi_base
      artifacts: false
      optional: true
    - job: build_windows_pixi_envs
      artifacts: false
      optional: true
  parallel:
    matrix:
      - PYTHON_VERSION: "3.10"
        PIXI_ENV: "py310-ci"
      - PYTHON_VERSION: "3.11"
        PIXI_ENV: "py311-ci"
      - PYTHON_VERSION: "3.12"
        PIXI_ENV: "py312-ci"
      - PYTHON_VERSION: "3.13"
        PIXI_ENV: "py313-ci"
      - PYTHON_VERSION: "3.14"
        PIXI_ENV: "py314-ci"
  cache: []
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File ci/scripts/windows_test_common.ps1

# ----- Test PyFuga (full matrix, change-based + scheduled) -----
test_linux_matrix:
  stage: test
  image: ${PYFUGA_CI_IMAGE_PREFIX}/ci/python-${PYTHON_VERSION}-uv-tests:latest
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  extends:
    - .default_python_job
    - .pytest_coverage
    - .pytest_notebook_html_artifacts
    - .rules_python_matrix_on_changes_or_schedule
  variables:
    GIT_LFS_SKIP_SMUDGE: "0"
  needs:
    - job: lint
      artifacts: false
    - job: security_secret_scan
      artifacts: false
    - job: security_dependency_audit
      artifacts: false
    - job: security_bandit
      artifacts: false
    - job: build_linux_test_images
      artifacts: false
      optional: true
  script:
    - python -m pytest -n logical --dist loadfile --cov-report
      term-missing:skip-covered --import-mode=importlib -m "not local" tests/
