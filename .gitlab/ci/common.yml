# Shared CI configuration (variables, workflow, and reusable hidden jobs).

# ===== Cap resource limits for CI jobs =====
variables:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHON_DEFAULT_VERSION: "3.12"
  PYTHON_DEFAULT_VERSION_TAG: "312"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: "copy"
  PIXI_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pixi"
  RATTLER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pixi"
  # Pull-only image prefix for CI runtime images. Override in staging if needed.
  PYFUGA_CI_IMAGE_PREFIX: "${CI_REGISTRY_IMAGE}"

cache:
  key: "uv-${CI_PROJECT_ID}-${CI_JOB_NAME}"
  paths:
    - .cache/uv/
  policy: pull-push

# ===== Workflow =====
workflow:
  rules:
    # Don't use merge request pipelines
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always

# ===== Set default Python version =====
image: ${PYFUGA_CI_IMAGE_PREFIX}/ci/python-${PYTHON_DEFAULT_VERSION}-uv:latest

# ===== Reusable hidden jobs =====
# ----- Shared rules -----
.rules_on_code_changes:
  rules:
    - changes:
        - pyfuga/**/*
        - tests/**/*
        - constraints/**/*
        - ".gitlab/ci/**/*"
        - pixi.lock
        - pyproject.toml
        - .coveragerc
        - .gitlab-ci.yml
      when: on_success
      allow_failure: false
    - when: manual
      allow_failure: true

.rules_always_auto:
  rules:
    - when: on_success
      allow_failure: false

.rules_python_matrix_on_changes_or_schedule:
  rules:
    - if: "$PYTHON_VERSION == $PYTHON_DEFAULT_VERSION"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: false
    - changes:
        - pyfuga/**/*
        - tests/**/*
        - constraints/**/*
        - ".gitlab/ci/**/*"
        - pixi.lock
        - pyproject.toml
        - .coveragerc
        - .gitlab-ci.yml
      when: on_success
      allow_failure: false
    - when: manual
      allow_failure: true

# ----- Shared pytest outputs -----
.pytest_coverage:
  coverage: "/(?i)total.*? (100(?:\\.0+)?\\%|[1-9]?\\d(?:\\.\\d+)?\\%)$/"

.pytest_notebook_html_artifacts:
  artifacts:
    paths:
      - tests/notebook_outputs/*.html
    when: always
    expire_in: 1 week

# ----- Shared job templates -----
.default_python_job:
  tags:
    - docker
    - ubuntu
    - linux
  variables:
    # Default to skipping Git LFS downloads for speed.
    # Jobs that need large fixtures (pytest) should override to "0".
    GIT_LFS_SKIP_SMUDGE: "1"
  before_script:
    # Environment setup
    - export UV_CACHE_DIR="${UV_CACHE_DIR:-$CI_PROJECT_DIR/.cache/uv}"
    - export UV_LINK_MODE="${UV_LINK_MODE:-copy}"
    - echo "UV_CACHE_DIR=$UV_CACHE_DIR"

    # Optional deep diagnostics for runner troubleshooting (disabled by default for speed).
    - |
      if [ "${CI_DEBUG:-0}" = "1" ] || [ "${CI_DEBUG:-false}" = "true" ]; then
        echo "=== Runner Info ==="
        echo "Hostname:$(hostname)"
        echo "Runner:${CI_RUNNER_DESCRIPTION:-unknown}"
        echo "Runner ID:${CI_RUNNER_ID:-unknown}"
        echo "Runner tags:${CI_RUNNER_TAGS:-unknown}"

        echo "=== Disk Space ==="
        df -h
        echo "=== Disk Inodes ==="
        df -i | head -n 1; df -i | grep -E '(/dev/|Filesystem)' || true

        echo "=== Memory Usage ==="
        free -h || true

        echo "=== Docker Info ==="
        docker info 2>/dev/null | grep -E '(Storage Driver|Docker Root Dir|Logging Driver|Cgroup)' || echo "Docker info not accessible (expected in jobs)"
        docker system df 2>/dev/null || echo "Docker system df not accessible (expected in jobs)"

        echo "=== Cache Sizes ==="
        du -sh /cache 2>/dev/null || true
        du -sh "$UV_CACHE_DIR" 2>/dev/null || true
        du -sh /root/.cache 2>/dev/null || true
        du -sh "$CI_PROJECT_DIR" || true
      else
        echo "CI_DEBUG!=1; skipping extended runner diagnostics"
      fi

    # Tool versions
    - echo "=== Tool Versions ==="
    - python -V
    - uv --version

.windows_test_job:
  extends: .pytest_coverage
  stage: test
  image: registry.windenergy.dtu.dk/dockerimages/windows-pixi:ltsc2019
  variables:
    GIT_STRATEGY: clone
    # Windows CI needs Git LFS to fetch large test fixtures.
    GIT_LFS_SKIP_SMUDGE: "0"
  before_script:
    - |
      if (("$env:CI_DEBUG" -eq "1") -or ("$env:CI_DEBUG" -eq "true")) {
        Write-Host "=== Windows Runner Diagnostics (CI_DEBUG=1) ==="
        Write-Host ("Timestamp: {0:o}" -f (Get-Date))
        $RunnerDesc = if ($env:CI_RUNNER_DESCRIPTION) { $env:CI_RUNNER_DESCRIPTION } else { "unknown" }
        $RunnerId = if ($env:CI_RUNNER_ID) { $env:CI_RUNNER_ID } else { "unknown" }
        $RunnerTags = if ($env:CI_RUNNER_TAGS) { $env:CI_RUNNER_TAGS } else { "unknown" }
        Write-Host ("Runner: {0}" -f $RunnerDesc)
        Write-Host ("Runner ID: {0}" -f $RunnerId)
        Write-Host ("Runner tags: {0}" -f $RunnerTags)

        Write-Host "=== CPU ==="
        Write-Host ("ProcessorCount: {0}" -f [Environment]::ProcessorCount)

        Write-Host "=== OS ==="
        try { (Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber | Format-List | Out-String).TrimEnd() | Write-Host } catch { Write-Host "Get-CimInstance Win32_OperatingSystem failed" }

        Write-Host "=== Memory ==="
        try { (Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory | Format-List | Out-String).TrimEnd() | Write-Host } catch { Write-Host "Get-CimInstance Win32_ComputerSystem failed" }

        Write-Host "=== Disk (PS drives) ==="
        try { (Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize | Out-String).TrimEnd() | Write-Host } catch { Write-Host "Get-PSDrive failed" }

        Write-Host "=== Paths ==="
        $ProjectDir = if ($env:CI_PROJECT_DIR) { $env:CI_PROJECT_DIR } else { "" }
        $Temp = if ($env:TEMP) { $env:TEMP } else { "" }
        $Tmp = if ($env:TMP) { $env:TMP } else { "" }
        Write-Host ("CI_PROJECT_DIR: {0}" -f $ProjectDir)
        Write-Host ("TEMP: {0}" -f $Temp)
        Write-Host ("TMP: {0}" -f $Tmp)
        Write-Host ("GetTempPath: {0}" -f [System.IO.Path]::GetTempPath())
      } else {
        Write-Host "CI_DEBUG!=1; skipping Windows runner diagnostics"
      }
  tags:
    - docker-windows
