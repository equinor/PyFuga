# Deploy CI configuration (GitLab Pages publishing and package publication).

# ===== Deploy stage =====

# ----- Deploy prebuilt docs to GitLab Pages -----
pages:
  stage: deploy
  variables:
    # Pages deploy only publishes prebuilt artifacts; skip Git LFS checkout downloads.
    GIT_LFS_SKIP_SMUDGE: "1"
  needs:
    - job: build_pages
      artifacts: true
  script:
    - test -d "public" || (echo "Missing public artifact from build_pages"; exit
      1)
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    # Only build and deploy docs for main branch and tags (releases)
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: on_success
      allow_failure: false

    # Otherwise never run
    - when: never

# ----- Publish PyFuga to PyPI (protected tags only) -----
publish_pypi:
  stage: deploy
  extends: .default_python_job
  needs:
    - job: build_release_artifacts
      artifacts: true
  script:
    - test -n "$TWINE_USERNAME" || (echo "TWINE_USERNAME is not set"; exit 1)
    - test -n "$TWINE_PASSWORD" || (echo "TWINE_PASSWORD is not set"; exit 1)
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install twine
    - python -m twine upload -u "$TWINE_USERNAME" -p "$TWINE_PASSWORD" dist/*
  rules:
    # Publish only for protected tags when credentials are configured
    - if:
        '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true" && $TWINE_USERNAME
        && $TWINE_PASSWORD'
      when: on_success
      allow_failure: false

    # Otherwise never run
    - when: never

# ----- Publish PyFuga to GitLab PyPI registry (private/manual test) -----
publish_gitlab_pypi:
  stage: deploy
  extends: .default_python_job
  needs:
    - job: build_release_artifacts
      artifacts: true
  script:
    - test -n "$CI_JOB_TOKEN" || (echo "CI_JOB_TOKEN is not set"; exit 1)
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - uv pip install twine
    - python -m twine upload --repository-url
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" -u
      gitlab-ci-token -p "$CI_JOB_TOKEN" dist/*
  rules:
    # Manual private test publish on this branch
    - if: '$CI_COMMIT_BRANCH == "test-pypi"'
      when: manual
      allow_failure: true

    # Otherwise never run
    - when: never

# ----- Verify PyFuga install from GitLab PyPI registry (private/manual test) -----
verify_gitlab_pypi:
  stage: deploy
  extends: .default_python_job
  needs:
    - job: publish_gitlab_pypi
  script:
    - test -n "$CI_JOB_TOKEN" || (echo "CI_JOB_TOKEN is not set"; exit 1)
    - VENV_DIR=".venv-${CI_JOB_ID}"
    - uv venv "${VENV_DIR}"
    - . "${VENV_DIR}/bin/activate"
    - PYPROJECT_VERSION="$(python -c 'import tomllib;
      print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
    - uv pip install --index-url
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/pypi/simple"
      --no-deps "pyfuga==${PYPROJECT_VERSION}"
    - uv pip install packaging
    - |
      python -c 'import importlib.metadata, pyfuga, tomllib; from packaging.version import Version; expected=tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; metadata_version=importlib.metadata.version("pyfuga"); attr_version=pyfuga.__version__; print(f"Installed pyfuga metadata={metadata_version}, attr={attr_version}"); assert Version(metadata_version) == Version(expected), f"Metadata version mismatch: expected {expected}, got {metadata_version}"; assert Version(attr_version) == Version(expected), f"pyfuga.__version__ mismatch: expected {expected}, got {attr_version}"'
  rules:
    - if: '$CI_COMMIT_BRANCH == "test-pypi"'
      when: manual
      allow_failure: true
    - when: never

# ----- Build PyFuga conda package from published PyPI source -----
build_conda:
  stage: deploy
  image: condaforge/miniforge3:latest
  cache: []
  variables:
    PIP_ROOT_USER_ACTION: "ignore"
    CONDA_NPY: "126"
  needs:
    - job: publish_pypi
  script:
    - mamba install -c conda-forge --override-channels -y conda-build
      python-build
    - python -m build --sdist
    # The committed recipe still names the previous release: the new sdist's sha256 only
    # exists once publish_pypi has uploaded it. So sync the recipe from PyPI here, wait
    # until PyPI reports this tag's version, then verify the published sdist.
    - |
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      for i in 1 2 3 4 5 6; do
        if python scripts/sync_conda_recipe.py &&
          grep -qxF "  version: ${TAG_VERSION}" conda-recipe/recipe.yaml &&
          python scripts/sync_conda_recipe.py --check --check-remote-source; then
          break
        fi
        if [ "$i" -eq 6 ]; then
          echo "Recipe sync or remote source verification for ${TAG_VERSION} failed after ${i} attempts"
          exit 1
        fi
        echo "PyPI sdist for ${TAG_VERSION} not ready yet (attempt ${i}/6), retrying in 20s..."
        sleep 20
      done
    - conda build --no-anaconda-upload -c conda-forge --override-channels
      --output-folder ./conda_channel conda-recipe/
  artifacts:
    untracked: false
    expire_in: "1 week"
    paths:
      - conda_channel/noarch/pyfuga*
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
      allow_failure: false
    - when: never
  tags:
    - docker
    - ubuntu
    - linux

# ----- Smoke-test conda build on non-protected refs (no publish/deploy) -----
build_conda_smoke:
  stage: deploy
  image: condaforge/miniforge3:latest
  cache: []
  variables:
    CONDA_NPY: "126"
  needs: []
  script:
    - mamba install -c conda-forge --override-channels -y conda-build
      python-build
    - python -m build --sdist
    - python scripts/sync_conda_recipe.py --check
    - |
      DIST_FILE="$(ls dist/pyfuga-*.tar.gz)"
      DIST_SHA256="$(sha256sum "${DIST_FILE}" | awk '{print $1}')"
      TMP_RECIPE_DIR="$(mktemp -d)"
      cp -r conda-recipe "${TMP_RECIPE_DIR}/"
      sed -i "s|^  url:.*$|  url: file://${CI_PROJECT_DIR}/${DIST_FILE}|" "${TMP_RECIPE_DIR}/conda-recipe/recipe.yaml"
      sed -i "s|^  sha256:.*$|  sha256: \"${DIST_SHA256}\"|" "${TMP_RECIPE_DIR}/conda-recipe/recipe.yaml"
      conda build --no-anaconda-upload -c conda-forge --override-channels --output-folder ./conda_channel "${TMP_RECIPE_DIR}/conda-recipe/"
  artifacts:
    untracked: false
    expire_in: "1 week"
    paths:
      - conda_channel/noarch/pyfuga*
  rules:
    - if:
        '$CI_COMMIT_BRANCH && ($ALLOW_CONDA_TEST == "1" || $ALLOW_CONDA_TEST ==
        "true")'
      when: manual
      allow_failure: true
    - when: never
  tags:
    - docker
    - ubuntu
    - linux

# ----- Publish PyFuga source to Zenodo on protected version tags -----
publish_zenodo:
  stage: deploy
  extends: .default_python_job
  script:
    # Source (not `bash`) the helper so its venv activation, and with it g2z-send, stays on PATH.
    - . ci/scripts/create_uv_venv.sh ".venv-zenodo-${CI_JOB_ID}" gitlab2zenodo
    - python ci/scripts/zenodo_upload.py --mode release
  rules:
    - if: "$CI_COMMIT_TAG && $CI_COMMIT_TAG =~ /^v?\\d+\\.\\d+(\\.\\d+)?$/ &&
        $CI_COMMIT_REF_PROTECTED == \"true\""
      when: on_success
      allow_failure: false
    - when: never

# ----- Manual Zenodo upload for an existing tag -----
# Used to test the Zenodo integration for an already-published tag (e.g. v0.1.0)
# without creating a new release tag.
zenodo_upload_for_tag:
  stage: deploy
  extends: .default_python_job
  needs: []
  script:
    # Source (not `bash`) the helper so its venv activation, and with it g2z-send, stays on PATH.
    - . ci/scripts/create_uv_venv.sh ".venv-zenodo-${CI_JOB_ID}" gitlab2zenodo
    - python ci/scripts/zenodo_upload.py --mode manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - if:
        '$CI_COMMIT_BRANCH && ($ALLOW_ZENODO_TEST == "1" || $ALLOW_ZENODO_TEST ==
        "true")'
      when: manual
      allow_failure: true
    - when: never
